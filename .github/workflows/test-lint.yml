name: Test + Lint
on:
  pull_request:
permissions: {contents: read}
concurrency: {group: 'test-lint-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  test-lint:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-test-lint.yml@ci-v1
    permissions: {contents: read}
    with:
      # hosted macOS runners bill 10x on a private repo; the lane turns on by itself once the repo is public.
      run_macos: ${{ !github.event.repository.private }}
      macos_skip_reason: 'private repo: hosted macOS runners bill 10x; the macOS lane runs automatically once the repository is public'
      # T-6: `make test` prints `suites: declared=N executed=M skipped=K` (tools/suite_summary.py); the gate reconciles it.
      require_suite_reconciliation: true
      pre_test_setup_ubuntu: |
        sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
        python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/python" -m pip install -q -e '.[test]' && echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      pre_test_setup_macos: |
        brew install -q ffmpeg
        python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/python" -m pip install -q -e '.[test]' && echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
